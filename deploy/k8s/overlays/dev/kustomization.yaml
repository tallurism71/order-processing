apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: order-platform-dev
resources:
  - ../../base
# The pipeline runs `kustomize edit set image` with the immutable build tag before applying.
images:
  - {name: order-service, newName: 111111111111.dkr.ecr.us-east-1.amazonaws.com/order-service, newTag: dev}
  - {name: inventory-service, newName: 111111111111.dkr.ecr.us-east-1.amazonaws.com/inventory-service, newTag: dev}
  - {name: payment-service, newName: 111111111111.dkr.ecr.us-east-1.amazonaws.com/payment-service, newTag: dev}
  - {name: reconciliation-batch, newName: 111111111111.dkr.ecr.us-east-1.amazonaws.com/reconciliation-batch, newTag: dev}
patches:
  - target: {kind: Deployment}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: HorizontalPodAutoscaler}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target: {kind: PodDisruptionBudget}
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target: {kind: ConfigMap, name: platform-config}
    patch: |-
      - op: replace
        path: /data/TRACE_SAMPLING
        value: "1.0"
