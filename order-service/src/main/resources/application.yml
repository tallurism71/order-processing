spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true   # Java 21 virtual threads: high request concurrency without large thread pools
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1500000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 500ms
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        compression.type: lz4
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: 8081
  shutdown: graceful

app:
  cache:
    orders-ttl: PT10M
  kafka:
    listener-concurrency: 3

platform:
  outbox:
    relay-enabled: true
    batch-size: 100
    poll-interval-ms: 500
  kafka:
    create-topics: ${KAFKA_CREATE_TOPICS:true}
    partitions: 6
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${APP_ENV:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}   # JSON (ECS) logs, shipped to Splunk / CloudWatch with traceId + correlationId
  level:
    root: INFO
    com.acme: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
