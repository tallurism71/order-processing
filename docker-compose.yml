# Local environment: the same topology as AWS (RDS Postgres, ElastiCache Redis, MSK Kafka) in containers.
#   ./gradlew build && docker compose up --build
#   docker compose --profile batch run --rm reconciliation-batch --businessDate=2026-11-24
name: order-platform

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}
    kafka: {condition: service_healthy}
  environment: &service-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    REDIS_HOST: redis
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    APP_ENV: local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - ./deploy/local/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.55.0
    ports: ["9090:9090"]
    volumes:
      - ./deploy/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/local/alerts.yml:/etc/prometheus/alerts.yml:ro

  order-service:
    <<: *service
    build: {context: ., args: {MODULE: order-service}}
    ports: ["${ORDER_PORT:-8081}:8081"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/orderdb

  inventory-service:
    <<: *service
    build: {context: ., args: {MODULE: inventory-service}}
    ports: ["${INVENTORY_PORT:-8082}:8082"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/inventorydb

  payment-service:
    <<: *service
    build: {context: ., args: {MODULE: payment-service}}
    ports: ["${PAYMENT_PORT:-8083}:8083"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb

  reconciliation-batch:
    profiles: ["batch"]
    build: {context: ., args: {MODULE: reconciliation-batch}}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/recondb
      ORDERS_DB_URL: jdbc:postgresql://postgres:5432/orderdb
      ORDERS_DB_USERNAME: recon
      ORDERS_DB_PASSWORD: recon
      EXTRACT_DIR: /extracts
    volumes:
      - ./build/extracts:/extracts
